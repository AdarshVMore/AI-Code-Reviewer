services:
  - type: web
    name: coderefyn-api
    runtime: docker
    dockerfilePath: ./Server/app/api-service/Dockerfile
    dockerContext: ./Server
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ENCRYPTION_SECRET
        sync: false
      - key: REDIS_CACHE_URL
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_PRIVATE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: web
    name: coderefyn-webhook
    runtime: docker
    dockerfilePath: ./Server/app/webhook-service/Dockerfile
    dockerContext: ./Server
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GITHUB_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_QUEUE_URL
        sync: false
      - key: WORKER_SERVICE_URL
        sync: false

  - type: web
    name: coderefyn-worker
    runtime: docker
    dockerfilePath: ./Server/app/worker-service/Dockerfile
    dockerContext: ./Server
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_QUEUE_URL
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_PRIVATE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: GIPHY_API_KEY
        sync: false
      - key: ENCRYPTION_SECRET
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
